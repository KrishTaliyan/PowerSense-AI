<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0c10" />
    <meta name="description" content="PowerSense AI grid operations console for deterministic outage localization, incident response and restoration verification." />
    <title>PowerSense AI · Grid Operations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking first paint; system fonts show until the web fonts arrive. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" /></noscript>
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong colors.
      try {
        var saved = localStorage.getItem("powersense-theme");
        var theme = saved === "light" || saved === "dark" ? saved : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <style>
      html, body { margin: 0; background: #0a0c10; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f5f6f8; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; font: 500 13px/1.4 Inter, system-ui, sans-serif; color: #8b93a3; }
      .boot-inner { display: grid; justify-items: center; gap: 14px; }
      .boot-mark { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, #3b82f6, #06b6d4); color: #fff; box-shadow: 0 8px 30px rgb(59 130 246 / 35%); }
      .boot-bar { width: 140px; height: 3px; overflow: hidden; border-radius: 3px; background: rgb(127 127 127 / 20%); }
      .boot-bar i { display: block; width: 40%; height: 100%; border-radius: inherit; background: #3b82f6; animation: boot 1.1s ease-in-out infinite; }
      @keyframes boot { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading PowerSense">
        <div class="boot-inner">
          <span class="boot-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m13 2-9 12h7l-1 8 9-12h-7l1-8Z"/></svg></span>
          <span>Loading PowerSense…</span>
          <span class="boot-bar"><i></i></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
